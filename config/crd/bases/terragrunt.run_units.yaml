apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: units.terragrunt.run
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
spec:
  group: terragrunt.run
  names:
    kind: Units
    listKind: UnitsList
    plural: units
    shortNames:
      - unit
    singular: unit
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - filters
                - branch
              properties:
                filters:
                  type: array
                  items:
                    type: string
                  description: "Paths within the GitRepository to monitor for changes"
                branch:
                  type: string
                  description: "Git branch to monitor"
                parallelism:
                  type: integer
                  default: 1
                  description: "Number of concurrent executions allowed"
            status:
              type: object
              properties:
                lastHandledReconcileAt:
                  type: string
                  description: "Last reconciliation timestamp"
                lastCommitSHA:
                  type: string
                  description: "SHA of the last detected change"