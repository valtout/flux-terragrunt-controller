---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: units.terragrunt.run
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
spec:
  group: terragrunt.run
  names:
    kind: Units
    listKind: UnitsList
    plural: units
    shortNames:
      - unit
    singular: unit
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - sourceRef
                - filters
                - branch
              properties:
                sourceRef:
                  type: object
                  description: "Reference to the GitRepository resource to monitor"
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: "Name of the GitRepository resource"
                filters:
                  type: array
                  items:
                    type: string
                  description: "Paths within the GitRepository to monitor for changes"
                branch:
                  type: string
                  description: "Git branch to monitor"
                parallelism:
                  type: integer
                  default: 1
                  description: "Number of concurrent executions allowed"
                env:
                  type: array
                  description: "Environment variables to inject into the runner pod"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: "Name of the environment variable"
                      value:
                        type: string
                        description: "Static value for the variable"
                      valueFrom:
                        type: object
                        description: "Source of the variable value"
                        properties:
                          secretKeyRef:
                            type: object
                            description: "Reference to a secret"
                            properties:
                              name:
                                type: string
                              key:
                                type: string
                            required:
                              - name
                              - key
                          configMapKeyRef:
                            type: object
                            description: "Reference to a configmap"
                            properties:
                              name:
                                type: string
                              key:
                                type: string
                            required:
                              - name
                              - key
                tf-vars:
                  type: array
                  description: "Terraform variables injected as TF_VAR_* environment variables"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: "Variable name (will be prefixed with TF_VAR_)"
                      value:
                        type: string
                        description: "Static value for the variable"
                      secretRef:
                        type: object
                        description: "Reference to a Kubernetes secret (value protected from logs)"
                        properties:
                          name:
                            type: string
                            description: "Name of the secret"
                          key:
                            type: string
                            description: "Key in the secret"
                        required:
                          - name
                          - key
            status:
              type: object
              properties:
                lastHandledReconcileAt:
                  type: string
                  description: "Last reconciliation timestamp"
                lastCommitSHA:
                  type: string
                  description: "SHA of the last detected change"
                lastRunnerJob:
                  type: string
                  description: "Name of the last runner job spawned"
