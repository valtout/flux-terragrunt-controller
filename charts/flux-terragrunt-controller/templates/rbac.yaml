apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: { { include "flux-terragrunt-controller.fullname" . } }
  labels: { { - include "flux-terragrunt-controller.labels" . | nindent 4 } }
rules:
  # Scaffold: replace with precise RBAC rules once the reconciler targets are defined.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: { { include "flux-terragrunt-controller.fullname" . } }
  labels: { { - include "flux-terragrunt-controller.labels" . | nindent 4 } }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: { { include "flux-terragrunt-controller.fullname" . } }
subjects:
  - kind: ServiceAccount
    name: { { include "flux-terragrunt-controller.serviceAccountName" . } }
    namespace: { { .Release.Namespace } }
