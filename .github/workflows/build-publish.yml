name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'images/**'
      - 'cmd/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - main
    paths:
      - 'images/**'
      - 'cmd/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'

env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE_NAME: ${{ github.repository }}/controller
  RUNNER_IMAGE_NAME: ${{ github.repository }}/runner

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            IS_RELEASE=true
          elif [[ $GITHUB_SHA == $GITHUB_REF ]]; then
            # Detached HEAD, use short SHA
            VERSION=0.0.0-${{ github.sha }}
            IS_RELEASE=false
          else
            # PR or branch push - use version from branch name or SHA
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            VERSION=0.0.0-$BRANCH_NAME-${{ github.sha }}
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

  controller:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for controller
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTROLLER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/Dockerfile.controller
          push: ${{ needs.prepare.outputs.is_release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/controller.tar

      - name: Upload controller image artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-image
          path: /tmp/controller.tar
          retention-days: 1

  runner:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.prepare.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for runner
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RUNNER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: ./images
          file: ./images/Dockerfile.runner
          push: ${{ needs.prepare.outputs.is_release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runner.tar

      - name: Upload runner image artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-image
          path: /tmp/runner.tar
          retention-days: 1

  verify:
    needs: [prepare, controller, runner]
    runs-on: ubuntu-latest
    steps:
      - name: Download controller image
        uses: actions/download-artifact@v4
        with:
          name: controller-image
          path: /tmp

      - name: Download runner image
        uses: actions/download-artifact@v4
        with:
          name: runner-image
          path: /tmp

      - name: Load controller image
        run: docker load --input /tmp/controller.tar

      - name: Load runner image
        run: docker load --input /tmp/runner.tar

      - name: Inspect controller image
        run: docker inspect ${{ env.CONTROLLER_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}

      - name: Inspect runner image
        run: docker inspect ${{ env.RUNNER_IMAGE_NAME }}:${{ needs.prepare.outputs.version }}