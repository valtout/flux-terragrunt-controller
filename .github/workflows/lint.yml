---
name: Lint

on:
  push:
    branches:
      - main
      - kick-off
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run lint
        run: make lint
