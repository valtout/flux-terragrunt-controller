---
name: helm-template

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches: ["**"]
    paths:
      - 'charts/**'

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Render chart
        run: |
          helm template flux-terragrunt-controller ./charts/flux-terragrunt-controller > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
