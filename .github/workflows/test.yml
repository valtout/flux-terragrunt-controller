---
name: test

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: ["**"]
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'go.mod'
      - 'go.sum'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run unit tests
        run: go test ./...
