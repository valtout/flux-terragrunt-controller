---
name: Helm Chart Tests

on:
  push:
    branches:
      - main
      - kick-off
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'

jobs:
  helm-test:
    name: Helm Chart Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run helm chart tests
        run: make helm-chart-tests
