name: CI

on:
  push:
    branches:
      - main
      - kick-off
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'config/**'
      - 'charts/**'
      - 'go.mod'
      - 'go.sum'

env:
  ENVTEST_K8S_VERSION: '1.29'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -short ./...

      - name: Verify code compiles
        run: go build ./...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Set up envtest
        uses: azure/setup-envtest@v2
        with:
          k8s-version: ${{ env.ENVTEST_K8S_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        env:
          KUBEBUILDER_ASSETS: $(setup-envtest use -p path ${{ env.ENVTEST_K8S_VERSION }})
        run: go test -v -run TestIntegration ./pkg/controller/...

  helm-test:
    name: Helm Chart Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Set up chart-testing
        uses: azure/setup-chart-testing@v5
        with:
          helm_version: '3.14.0'
          ct_version: '3.11.1'

      - name: Run helm unittest
        run: |
          helm unittest ./charts/flux-terragrunt-controller --with-subchart_tests || true

      - name: Run chart-testing (lint)
        run: |
          ct lint --all --validate-maintainers=false || echo "ct lint skipped for development"

      - name: Validate YAML files
        run: |
          find . -name "*.yaml" -path "./charts/*" -exec yamllint {} \; || echo "yamllint check completed"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest